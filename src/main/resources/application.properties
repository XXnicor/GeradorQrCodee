spring.application.name=GeradorQrCode
server.port=${PORT:8080}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://front-end-qr-code-seven.vercel.app}

aws.s3.region=${AWS_REGION:sa-east-1}
aws.s3.bucket=${AWS_S3_BUCKET_NAME:code-generatett-qrcode}
aws.s3.presigned-duration-minutes=${AWS_S3_PRESIGNED_DURATION_MINUTES:15}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never